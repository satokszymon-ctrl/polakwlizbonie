<script>
(function(){
  var b=document.querySelector('.navtoggle'),n=document.getElementById('mainnav');
  if(!b||!n)return;
  b.addEventListener('click',function(){
    var open=n.classList.toggle('open');
    b.setAttribute('aria-expanded',open?'true':'false');
  });
  document.addEventListener('click',function(e){
    if(!n.classList.contains('open'))return;
    if(n.contains(e.target)||b.contains(e.target))return;
    n.classList.remove('open');b.setAttribute('aria-expanded','false');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&n.classList.contains('open')){n.classList.remove('open');b.setAttribute('aria-expanded','false');b.focus();}
  });
})();
</script>
